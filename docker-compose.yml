services:
  mysql:
    image: mysql:8.4
    container_name: exoplanetas_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: astronomia
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - astronomia_net

  streamlit:
    image: andresperez3/exoplanetas:latest
    build: .
    container_name: exoplanetas_streamlit
    ports:
      - "8501:8501"
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: astronomia
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - astronomia_net

volumes:
  mysql_data:

networks:
  astronomia_net:
    driver: bridge
